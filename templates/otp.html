<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>

    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:#0f172a;
            font-family:Poppins;
        }

        .box{
            width:350px;
            padding:40px;
            background:#111827;
            border:2px solid #00d4ff;
            box-shadow:0 0 20px #00d4ff;
            border-radius:20px;
            text-align:center;
        }

        h2{
            color:#00d4ff;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:20px 0;
            background:transparent;
            border:2px solid #00d4ff;
            color:#fff;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:12px;
            background:#00d4ff;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="box">

    <h2>Enter OTP</h2>

    <form action="/verify" method="POST">

        <input type="text" name="otp" placeholder="Enter OTP" required>

        <button type="submit">Verify OTP</button>

    </form>

</div>

</body>

</html>
