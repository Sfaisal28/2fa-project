<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - 2FA</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
          rel='stylesheet'>
</head>

<body>

<div class="auth-wrapper">

    <div class="credentials-panel signin">

        <form action="/register" method="POST">

            <h2 class="slide-element">Create Account</h2>

            <div class="field-wrapper slide-element">
                <input type="text" name="name" required>
                <label>Full Name</label>
                <i class='bx bxs-user'></i>
            </div>

            <div class="field-wrapper slide-element">
                <input type="email" name="email" required>
                <label>Email</label>
                <i class='bx bxs-envelope'></i>
            </div>

            <div class="field-wrapper slide-element">
                <input type="password" name="password" required>
                <label>Password</label>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="field-wrapper slide-element">
                <input type="password" name="confirm_password" required>
                <label>Confirm Password</label>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <button type="submit" class="submit-button slide-element">
                Create Account
            </button>

            <p class="auth-link slide-element">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
